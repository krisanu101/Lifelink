# LifeLink on a server: app + MySQL + automatic HTTPS (Caddy). Made by Krisanu.
# 1) cp .env.example .env   and edit it     2) docker compose up -d --build
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: lifelink
      MYSQL_USER: lifelink
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: mysql
      MYSQL_HOST: db
      MYSQL_USER: lifelink
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: lifelink
      HTTPS: "1"
      TRUST_PROXY: "1"
      SEED_DEMO: ${SEED_DEMO:-0}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-demo}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      SMS_LANG: ${SMS_LANG:-en}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  dbdata:
  caddy_data:
